<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel RPG - El nacimiento de la aldea</title>
<style>
:root {
  --fondo: #f6f1e4;
  --panel: #fffdf6;
  --texto: #1d1a14;
  --suave: #5c5546;
  --borde: #8a7f66;
  --acento: #7a3b12;
  --acento-fondo: #f0dfc2;
  --ok: #14612b;
  --ok-fondo: #d6f0dc;
  --mal: #a11414;
  --mal-fondo: #fadada;
  --sel: #1f4e9e;
  --editable: #fff6d6;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  line-height: 1.45;
}
#app { max-width: 1500px; margin: 0 auto; padding: 8px; }
h1, h2, h3 { margin: 0 0 6px; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.05rem; border-bottom: 1px solid var(--borde); padding-bottom: 3px; }
h3 { font-size: 0.95rem; }
p { margin: 6px 0; }
button, input, select { font: inherit; color: inherit; }
button {
  background: var(--acento-fondo);
  border: 1px solid var(--acento);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: #e6cc9d; }
button:disabled { opacity: 0.55; cursor: default; }
button.principal { background: var(--acento); color: #fff; font-weight: bold; }
button.principal:hover:not(:disabled) { background: #5f2d0c; }
button.enlace { background: none; border: none; padding: 1px 0; text-align: left; text-decoration: underline; color: var(--acento); }
button.enlace.activo { font-weight: bold; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 1px; }
input[type=text], select { background: #fff; border: 1px solid var(--borde); border-radius: 3px; padding: 4px 6px; }
label { display: block; margin: 8px 0; }
label input, label select { display: block; margin-top: 3px; min-width: 16rem; }

.cabecera { background: var(--panel); border: 2px solid var(--borde); border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; }
.fila-cab { margin: 2px 0; }
.nombre { font-weight: bold; font-size: 1.1rem; }
.xp { white-space: pre; }
.stats { color: var(--suave); }
.botones-cab { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.rejilla { display: grid; grid-template-columns: 270px minmax(0, 1fr) 260px; gap: 8px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
.lista-simple, .registro, .pistas { margin: 4px 0; padding-left: 0; list-style: none; }
.registro, .pistas { padding-left: 1.2rem; list-style: disc; font-size: 0.9rem; }
.pistas { list-style: decimal; background: var(--acento-fondo); border-radius: 3px; padding: 6px 6px 6px 2rem; }
.lista-simple li { margin: 3px 0; }
.suave, .pendiente { color: var(--suave); }
.pendiente { opacity: 0.8; }
.desbloqueada { color: var(--ok); }
.bloqueada { color: var(--suave); }
.meta { color: var(--suave); font-size: 0.9rem; }
.que-hacer { border: 2px solid var(--acento); background: var(--acento-fondo); border-radius: 4px; padding: 6px 12px; margin-top: 8px; }
.que-hacer ul { margin: 4px 0; padding-left: 1.2rem; }
.error { color: var(--mal); }
.mensajes { background: var(--mal-fondo); border: 1px solid var(--mal); border-radius: 3px; padding: 6px 6px 6px 1.6rem; margin: 8px 0; }
.aviso.ok { background: var(--ok-fondo); border: 2px solid var(--ok); border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; }
.nivel { font-weight: bold; }
.estado-msg { min-height: 1.4em; color: var(--suave); font-size: 0.9rem; margin-top: 4px; }
.botones { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.proximamente { font-style: italic; }

.barra-formulas { display: flex; align-items: center; gap: 8px; border: 1px solid var(--borde); background: #fff; padding: 3px 6px; margin-bottom: 4px; min-height: 2rem; }
.nombre-celda { font-weight: bold; min-width: 3.5rem; border-right: 1px solid var(--borde); }
.fx { color: var(--suave); font-style: italic; }
.barra-texto { white-space: pre-wrap; word-break: break-all; }
.explica { font-size: 0.9rem; margin-bottom: 4px; }

.hoja-wrap { overflow: auto; max-width: 100%; border: 1px solid var(--borde); background: #fff; }
.hoja { border-collapse: collapse; }
.hoja th, .hoja td { border: 1px solid #c9c0a8; padding: 2px 6px; height: 1.9rem; white-space: nowrap; }
.hoja th { background: #e9e2d0; font-weight: normal; color: var(--suave); text-align: center; position: sticky; top: 0; }
.hoja th.cab-fila { position: static; min-width: 2.2rem; }
.hoja td { max-width: 32ch; overflow: hidden; text-overflow: ellipsis; cursor: cell; }
.hoja td.num { text-align: right; }
.hoja td.editable { background: var(--editable); }
.hoja td.hecha { background: #eef3ea; }
.hoja td.err { color: var(--mal); font-weight: bold; }
.hoja td.rango { background: #d9e6fb; }
.hoja td.sel { outline: 3px solid var(--sel); outline-offset: -2px; background: #e8f0fe; }
.hoja td.ok { background: var(--ok-fondo); }
.hoja td.mal { background: var(--mal-fondo); }
.celda-input { width: 100%; min-width: 12ch; border: none; background: #fff; padding: 0; outline: none; }

.panel-grafico { margin-top: 10px; border-top: 1px dashed var(--borde); padding-top: 6px; }
.grafico { width: 100%; max-width: 480px; height: auto; display: block; margin-top: 8px; background: #fff; border: 1px solid var(--borde); }
.g-barra { fill: var(--acento); }
.g-linea { stroke: var(--acento); stroke-width: 2.5; }
.g-eje { stroke: var(--texto); stroke-width: 1; }
.g-titulo { font-size: 14px; font-weight: bold; fill: var(--texto); }
.g-valor, .g-etq { font-size: 11px; fill: var(--texto); }

.pantalla { max-width: 720px; margin: 20px auto; }

@media (max-width: 1000px) {
  .rejilla { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<div id="app"></div>
<noscript>Este juego necesita JavaScript activado.</noscript>
<script>
/* Motor de fórmulas y hoja de cálculo (Excel en español de España). Sin DOM. */
(function (raiz, fabrica) {
  if (typeof module === 'object' && module.exports) module.exports = fabrica();
  else raiz.Engine = fabrica();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const FUNCIONES = ['SUMA', 'PROMEDIO', 'MAX', 'MIN', 'CONTAR', 'SI', 'ENTERO', 'REDONDEAR'];

  const EXPLICACIONES = {
    '#¿NOMBRE?': 'Excel no reconoce una función o un nombre de la fórmula. Revisa que esté bien escrito.',
    '#DIV/0!': 'Estás dividiendo entre cero (o entre una celda vacía). Una división necesita un divisor distinto de 0.',
    '#VALOR!': 'Estás operando con texto o con un tipo de dato que no encaja. Las operaciones necesitan números.',
    '#REF!': 'La fórmula apunta a una celda que no existe en esta hoja.',
    '#CIRCULAR': 'Referencia circular: la fórmula depende de sí misma, directa o indirectamente.',
    '#ERROR!': 'La fórmula no está bien escrita. Revisa paréntesis, operadores y separadores.'
  };

  class ErrorHoja {
    constructor(codigo, explicacion) {
      this.codigo = codigo;
      this.explicacion = explicacion || EXPLICACIONES[codigo] || '';
    }
    toString() { return this.codigo; }
  }
  const err = (codigo, explicacion) => new ErrorHoja(codigo, explicacion);
  const esError = (v) => v instanceof ErrorHoja;

  /* ---------- Referencias ---------- */
  function colALetra(c) {
    let s = '';
    c += 1;
    while (c > 0) {
      const m = (c - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      c = Math.floor((c - 1) / 26);
    }
    return s;
  }
  function letraACol(s) {
    let n = 0;
    for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  const RE_REF = /^(\$?)([A-Za-z]{1,3})(\$?)(\d+)$/;
  function parsearRef(texto) {
    const m = RE_REF.exec(String(texto).trim());
    if (!m) return null;
    return { c: letraACol(m[2]), r: parseInt(m[4], 10), absC: m[1] === '$', absR: m[3] === '$' };
  }
  const refA1 = (c, r) => colALetra(c) + r;

  /* ---------- Tokenizador ---------- */
  const ERR_SINTAXIS = () => err('#ERROR!', 'La fórmula no está bien escrita: revisa paréntesis, operadores y separadores.');
  const ERR_COMA = () => err('#ERROR!', 'En Excel en español los argumentos se separan con ; (punto y coma)');
  const esDig = (c) => c !== undefined && c >= '0' && c <= '9';
  const RE_PALABRA = /[A-Za-z0-9_.$ÁÉÍÓÚÜÑáéíóúüñ]/;
  const RE_INICIO = /[A-Za-z_$ÁÉÍÓÚÜÑáéíóúüñ]/;

  function tokenizar(src) {
    const toks = [];
    const n = src.length;
    let i = 0;
    while (i < n) {
      const c = src[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (esDig(c)) {
        let j = i;
        while (esDig(src[j])) j++;
        if ((src[j] === ',' || src[j] === '.') && esDig(src[j + 1])) {
          j++;
          while (esDig(src[j])) j++;
        }
        if (src[j] !== undefined && RE_INICIO.test(src[j])) throw ERR_SINTAXIS();
        toks.push({ t: 'num', v: parseFloat(src.slice(i, j).replace(',', '.')), i, j });
        i = j;
        continue;
      }
      if (c === '"') {
        let j = i + 1;
        let s = '';
        let cerrada = false;
        while (j < n) {
          if (src[j] === '"') {
            if (src[j + 1] === '"') { s += '"'; j += 2; continue; }
            cerrada = true;
            j++;
            break;
          }
          s += src[j++];
        }
        if (!cerrada) throw ERR_SINTAXIS();
        toks.push({ t: 'str', v: s, i, j });
        i = j;
        continue;
      }
      if (RE_INICIO.test(c)) {
        let j = i;
        while (j < n && RE_PALABRA.test(src[j])) j++;
        const palabra = src.slice(i, j);
        if (src[j] === '(') {
          toks.push({ t: 'func', v: palabra.toUpperCase(), i, j });
          i = j;
          continue;
        }
        const ra = parsearRef(palabra);
        if (ra) {
          if (src[j] === ':') {
            let k = j + 1;
            while (k < n && RE_PALABRA.test(src[k])) k++;
            const rb = parsearRef(src.slice(j + 1, k));
            if (!rb) throw ERR_SINTAXIS();
            toks.push({ t: 'rango', a: ra, b: rb, i, j: k });
            i = k;
          } else {
            toks.push({ t: 'ref', ref: ra, i, j });
            i = j;
          }
          continue;
        }
        toks.push({ t: 'nombre', v: palabra.toUpperCase(), i, j });
        i = j;
        continue;
      }
      if (c === ',') throw ERR_COMA();
      const dos = src.slice(i, i + 2);
      if (dos === '<>' || dos === '<=' || dos === '>=') {
        toks.push({ t: 'op', v: dos, i, j: i + 2 });
        i += 2;
        continue;
      }
      if ('+-*/^=<>();'.includes(c)) {
        toks.push({ t: 'op', v: c, i, j: i + 1 });
        i++;
        continue;
      }
      throw ERR_SINTAXIS();
    }
    return toks;
  }

  /* ---------- Parser ---------- */
  function parsear(toks) {
    let p = 0;
    const sig = () => toks[p];
    const esOp = (v) => toks[p] && toks[p].t === 'op' && toks[p].v === v;
    function esperar(v) {
      if (!esOp(v)) throw ERR_SINTAXIS();
      p++;
    }
    function cmp() {
      let a = suma();
      while (sig() && sig().t === 'op' && ['=', '<>', '<', '>', '<=', '>='].includes(sig().v)) {
        const op = toks[p++].v;
        a = { t: 'bin', op, a, b: suma() };
      }
      return a;
    }
    function suma() {
      let a = mul();
      while (esOp('+') || esOp('-')) {
        const op = toks[p++].v;
        a = { t: 'bin', op, a, b: mul() };
      }
      return a;
    }
    function mul() {
      let a = pot();
      while (esOp('*') || esOp('/')) {
        const op = toks[p++].v;
        a = { t: 'bin', op, a, b: pot() };
      }
      return a;
    }
    function pot() {
      let a = unario();
      while (esOp('^')) {
        p++;
        a = { t: 'bin', op: '^', a, b: unario() };
      }
      return a;
    }
    function unario() {
      if (esOp('-') || esOp('+')) {
        const op = toks[p++].v;
        return { t: 'un', op, e: unario() };
      }
      return primario();
    }
    function primario() {
      const tk = sig();
      if (!tk) throw ERR_SINTAXIS();
      if (tk.t === 'num' || tk.t === 'str') { p++; return { t: tk.t, v: tk.v }; }
      if (tk.t === 'ref') { p++; return { t: 'ref', c: tk.ref.c, r: tk.ref.r }; }
      if (tk.t === 'rango') { p++; return { t: 'rango', a: tk.a, b: tk.b }; }
      if (tk.t === 'nombre') { p++; return { t: 'nombre', v: tk.v }; }
      if (tk.t === 'func') {
        p++;
        esperar('(');
        const args = [];
        if (!esOp(')')) {
          args.push(cmp());
          while (esOp(';')) { p++; args.push(cmp()); }
        }
        esperar(')');
        return { t: 'func', nombre: tk.v, args };
      }
      if (esOp('(')) {
        p++;
        const e = cmp();
        esperar(')');
        return e;
      }
      throw ERR_SINTAXIS();
    }
    const raiz = cmp();
    if (p < toks.length) throw ERR_SINTAXIS();
    return raiz;
  }

  const cacheCompilado = new Map();
  function compilar(raw) {
    let r = cacheCompilado.get(raw);
    if (r) return r;
    try {
      r = { ast: parsear(tokenizar(raw.slice(1))) };
    } catch (e) {
      if (!(e instanceof ErrorHoja)) throw e;
      r = { error: e };
    }
    if (cacheCompilado.size > 5000) cacheCompilado.clear();
    cacheCompilado.set(raw, r);
    return r;
  }

  /* ---------- Conversión de valores ---------- */
  const RE_NUM = /^\s*[+-]?\d+([.,]\d+)?\s*$/;
  function textoANumero(s) {
    return RE_NUM.test(s) ? parseFloat(s.replace(',', '.')) : null;
  }
  function interpretar(raw) {
    if (raw === undefined || raw === null) return null;
    const t = String(raw);
    if (t.trim() === '') return null;
    const n = textoANumero(t);
    return n === null ? t : n;
  }
  const escalar = (v) => (v && v.celdas ? err('#VALOR!', 'Aquí hace falta un único valor, no un rango. Usa una función como SUMA para trabajar con rangos.') : v);
  function aNumero(v) {
    if (esError(v)) return v;
    if (typeof v === 'number') return v;
    if (v === null) return 0;
    if (typeof v === 'boolean') return v ? 1 : 0;
    const n = textoANumero(v);
    return n === null ? err('#VALOR!') : n;
  }

  /* ---------- Evaluación ---------- */
  class Pasada {
    constructor(hoja) {
      this.hoja = hoja;
      this.memo = new Map();
      this.enCurso = new Set();
    }
    celda(c, r) {
      const h = this.hoja;
      if (c < 0 || r < 1 || c >= h.cols || r > h.filas) return err('#REF!');
      const clave = r * 1000 + c;
      if (this.memo.has(clave)) return this.memo.get(clave);
      if (this.enCurso.has(clave)) return err('#CIRCULAR');
      this.enCurso.add(clave);
      let v;
      const raw = h.crudoCR(c, r);
      if (typeof raw === 'string' && raw.startsWith('=')) v = this.formula(raw);
      else v = interpretar(raw);
      this.enCurso.delete(clave);
      this.memo.set(clave, v);
      return v;
    }
    formula(raw) {
      const comp = compilar(raw);
      if (comp.error) return comp.error;
      let v = evaluar(comp.ast, this);
      v = escalar(v);
      return v === null ? 0 : v;
    }
    rango(n) {
      const h = this.hoja;
      for (const e of [n.a, n.b]) {
        if (e.c < 0 || e.r < 1 || e.c >= h.cols || e.r > h.filas) return err('#REF!');
      }
      const c1 = Math.min(n.a.c, n.b.c), c2 = Math.max(n.a.c, n.b.c);
      const r1 = Math.min(n.a.r, n.b.r), r2 = Math.max(n.a.r, n.b.r);
      const celdas = [];
      for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) celdas.push(this.celda(c, r));
      return { celdas };
    }
  }

  function comparar(op, a, b) {
    if (a === null) a = typeof b === 'string' ? '' : typeof b === 'boolean' ? false : 0;
    if (b === null) b = typeof a === 'string' ? '' : typeof a === 'boolean' ? false : 0;
    const rango = (x) => (typeof x === 'number' ? 0 : typeof x === 'string' ? 1 : 2);
    let cmp;
    if (rango(a) !== rango(b)) cmp = rango(a) - rango(b);
    else if (typeof a === 'string') {
      const x = a.toLowerCase(), y = b.toLowerCase();
      cmp = x < y ? -1 : x > y ? 1 : 0;
    } else cmp = a < b ? -1 : a > b ? 1 : 0;
    switch (op) {
      case '=': return cmp === 0;
      case '<>': return cmp !== 0;
      case '<': return cmp < 0;
      case '>': return cmp > 0;
      case '<=': return cmp <= 0;
      default: return cmp >= 0;
    }
  }

  function recolectar(args, ctx, nombre) {
    const out = [];
    for (const a of args) {
      if (a.t === 'ref' || a.t === 'rango') {
        const v = evaluar(a, ctx);
        if (esError(v)) return v;
        for (const x of v.celdas || [v]) {
          if (esError(x)) return x;
          if (typeof x === 'number') out.push(x);
        }
      } else {
        const v = escalar(evaluar(a, ctx));
        if (esError(v)) return v;
        if (typeof v === 'number') out.push(v);
        else if (typeof v === 'boolean') out.push(v ? 1 : 0);
        else if (typeof v === 'string') {
          const n = textoANumero(v);
          if (n !== null) out.push(n);
          else if (nombre !== 'CONTAR') return err('#VALOR!', 'Has escrito texto donde la función espera números.');
        }
      }
    }
    return out;
  }

  function redondear(x, d) {
    d = Math.trunc(d);
    const f = Math.pow(10, d);
    const abs = Math.abs(x) * f * (1 + 1e-15);
    return (Math.sign(x) * Math.round(abs)) / f;
  }

  function aridad(nombre, args, min, max) {
    if (args.length < min || args.length > max) {
      const cuantos = min === max ? `${min}` : `entre ${min} y ${max}`;
      return err('#ERROR!', `La función ${nombre} necesita ${cuantos} argumento(s) separados por ;`);
    }
    return null;
  }

  function llamar(n, ctx) {
    const { nombre, args } = n;
    let e;
    switch (nombre) {
      case 'SUMA': case 'PROMEDIO': case 'MAX': case 'MIN': case 'CONTAR': {
        if (args.length < 1) return err('#ERROR!', `La función ${nombre} necesita al menos un argumento.`);
        const nums = recolectar(args, ctx, nombre);
        if (esError(nums)) return nums;
        if (nombre === 'SUMA') return nums.reduce((s, x) => s + x, 0);
        if (nombre === 'CONTAR') return nums.length;
        if (nombre === 'PROMEDIO') {
          return nums.length ? nums.reduce((s, x) => s + x, 0) / nums.length : err('#DIV/0!', 'PROMEDIO no encontró ningún número que promediar.');
        }
        if (!nums.length) return 0;
        return nombre === 'MAX' ? Math.max(...nums) : Math.min(...nums);
      }
      case 'SI': {
        if ((e = aridad(nombre, args, 2, 3))) return e;
        let cond = escalar(evaluar(args[0], ctx));
        if (esError(cond)) return cond;
        if (typeof cond === 'string') return err('#VALOR!', 'La condición de SI debe ser una comparación (verdadera o falsa), no texto.');
        cond = cond === null ? false : typeof cond === 'boolean' ? cond : cond !== 0;
        if (cond) return escalar(evaluar(args[1], ctx));
        return args[2] ? escalar(evaluar(args[2], ctx)) : false;
      }
      case 'ENTERO': {
        if ((e = aridad(nombre, args, 1, 1))) return e;
        const x = aNumero(escalar(evaluar(args[0], ctx)));
        return esError(x) ? x : Math.floor(x);
      }
      case 'REDONDEAR': {
        if ((e = aridad(nombre, args, 2, 2))) return e;
        const x = aNumero(escalar(evaluar(args[0], ctx)));
        if (esError(x)) return x;
        const d = aNumero(escalar(evaluar(args[1], ctx)));
        return esError(d) ? d : redondear(x, d);
      }
      default:
        return err('#¿NOMBRE?', `Excel no reconoce la función «${nombre}». En este juego tienes: ${FUNCIONES.join(', ')}.`);
    }
  }

  function evaluar(n, ctx) {
    switch (n.t) {
      case 'num': case 'str': return n.v;
      case 'ref': return ctx.celda(n.c, n.r);
      case 'rango': return ctx.rango(n);
      case 'nombre': return err('#¿NOMBRE?', `Excel no reconoce «${n.v}». Si es texto, ponlo entre comillas dobles; si es una celda, revisa su letra y número.`);
      case 'func': return llamar(n, ctx);
      case 'un': {
        const x = aNumero(escalar(evaluar(n.e, ctx)));

    const registro = estado.registro.length
      ? estado.registro.map((r) => `<li><b>${esc(r.titulo)}:</b> ${esc(r.texto)}</li>`).join('')
      : '<li class="suave">Aún no ha pasado nada en la aldea.</li>';
    return `<aside class="izquierda">
      <section class="panel"><h2>Estado de la aldea</h2><ul class="lista-simple">
        <li>Trigo: <b>${a.trigo.toLocaleString('es-ES', { maximumFractionDigits: 2 })}</b> kg</li>
        <li>Huevos: <b>${a.huevos}</b></li>
        <li>Población: <b>${a.poblacion}</b></li>
        <li>Trabajadores: <b>${a.trabajadores}</b></li>
        <li>Edificios: <b>${a.edificios.length}</b>${a.edificios.length ? ' (' + esc(a.edificios.join(', ')) + ')' : ''}</li></ul></section>
      <section class="panel"><h2>Misiones</h2><ul class="lista-simple">${misiones}</ul></section>
      <section class="panel"><h2>Registro</h2><ul class="registro">${registro}</ul></section>
    </aside>`;
  }

  function htmlCodice() {
    const items = J.libro(estado).map((c) => c.desbloqueada
      ? `<li class="desbloqueada">✓ ${esc(c.nombre)}</li>`
      : `<li class="pendiente">○ ${esc(c.nombre)}</li>`).join('');
    return `<aside class="derecha"><section class="panel"><h2>Códice</h2><ul class="lista-simple">${items}</ul></section></aside>`;
  }

  function rangoSel() {
    const { anchor, sel } = ui;
    if (anchor.c !== sel.c) return { c: sel.c, r1: sel.r, r2: sel.r };
    return { c: sel.c, r1: Math.min(anchor.r, sel.r), r2: Math.max(anchor.r, sel.r) };
  }

  function htmlHoja(cx) {
    const { hoja, datos } = cx;
    const rg = rangoSel();
    const anchos = [];
    for (let c = 0; c < datos.cols; c++) {
      let mx = 4;
      for (let r = 1; r <= datos.filas; r++) mx = Math.max(mx, hoja.texto(E.refA1(c, r)).length);
      anchos.push(Math.min(30, mx) + 2);
    }
    let h = '<div class="hoja-wrap" tabindex="0" role="grid" aria-label="Hoja de cálculo. Flechas para moverse, F2 para editar, Ctrl+D para rellenar hacia abajo"><table class="hoja"><thead><tr><th class="esq"></th>';
    for (let c = 0; c < datos.cols; c++) h += `<th class="cab-col" style="min-width:${anchos[c]}ch">${E.colALetra(c)}</th>`;
    h += '</tr></thead><tbody>';
    for (let r = 1; r <= datos.filas; r++) {
      h += `<tr><th class="cab-fila">${r}</th>`;
      for (let c = 0; c < datos.cols; c++) {
        const ref = E.refA1(c, r);
        const v = hoja.valor(ref);
        const cls = ['celda'];
        if (cx.edit.has(ref)) cls.push(cx.soloLectura ? 'hecha' : 'editable');
        if (typeof v === 'number') cls.push('num');
        if (E.esError(v)) cls.push('err');
        if (c === ui.sel.c && r === ui.sel.r) cls.push('sel');
        else if (c === rg.c && r >= rg.r1 && r <= rg.r2) cls.push('rango');
        const res = ui.resultado[ref];
        if (res === 'ok') cls.push('ok'); else if (res) cls.push('mal');
        const titulo = E.esError(v) ? ` title="${esc(v.codigo + ': ' + v.explicacion)}"` : '';
        let contenido;
        if (ui.editando && ui.editando.ref === ref) {
          contenido = `<input class="celda-input" value="${esc(ui.editando.texto)}" spellcheck="false" autocomplete="off" aria-label="Editando ${ref}">`;
        } else contenido = esc(hoja.texto(ref));
        h += `<td class="${cls.join(' ')}" data-ref="${ref}"${titulo}>${contenido}</td>`;
      }
      h += '</tr>';
    }
    return h + '</tbody></table></div>';
  }

  function htmlBarra(cx) {
    const ref = E.refA1(ui.sel.c, ui.sel.r);
    const raw = ui.editando ? ui.editando.texto : (cx.hoja.crudo(ref) || '');
    const v = cx.hoja.valor(ref);
    const expl = E.esError(v) ? `<div class="explica error" role="status">${esc(v.codigo)}: ${esc(v.explicacion)}</div>` : '';
    return `<div class="barra-formulas"><span class="nombre-celda">${ref}</span><span class="fx">fx</span><span id="barra-texto" class="barra-texto">${esc(raw)}</span></div>${expl}`;
  }

  function htmlGraficoPanel(cx) {
    if (cx.soloLectura) {
      const g = estado.grafico;
      return g ? `<div class="panel-grafico">${svgGrafico(cx.datos, g) || ''}</div>` : '';
    }
    const g = ui.grafico;
    const dibujo = ui.vistaGrafico ? (svgGrafico(cx.datos, g) || '<p class="error">No se puede dibujar un gráfico con ese rango. Escríbelo como CELDA:CELDA (por ejemplo, de la esquina superior izquierda a la inferior derecha).</p>') : '';
    return `<div class="panel-grafico"><h3>Panel de gráfico</h3>
      <label>Rango de datos <input type="text" data-campo="rango" value="${esc(g.rango)}" placeholder="CELDA:CELDA" autocomplete="off"></label>
      <label>Tipo de gráfico <select data-campo="tipo">
        <option value=""${g.tipo === '' ? ' selected' : ''}>Elige un tipo…</option>
        <option value="columnas"${g.tipo === 'columnas' ? ' selected' : ''}>Columnas</option>
        <option value="líneas"${g.tipo === 'líneas' ? ' selected' : ''}>Líneas</option></select></label>
      <label>Título <input type="text" data-campo="titulo" value="${esc(g.titulo)}" autocomplete="off"></label>
      <button data-act="dibujar">Dibujar gráfico</button>${dibujo}</div>`;
  }

  function htmlAviso() {
    const r = ui.aviso;
    if (!r) return '';
    const ganancias = Object.keys(r.stats).map((k) => `+${r.stats[k]} ${J.NOMBRES_STATS[k]}`).join(', ');
    return `<div class="aviso ok" role="status"><strong>¡Misión completada!</strong> +${r.xp} XP · +${r.oro} oro · ${esc(ganancias)}
      <p>${esc(r.consecuencia)}</p>${r.mensajeNivel ? `<p class="nivel">${esc(r.mensajeNivel)}</p>` : ''}
      <button data-act="siguiente">${estado.misionActual >= NMISIONES ? 'Ver el resumen final' : 'Siguiente misión'}</button></div>`;
  }

  function htmlFinal() {
    const r = J.resumenFinal(estado);
    const stats = J.STATS.map((s) => `<li>${J.NOMBRES_STATS[s]}: <b>${r.stats[s]}</b></li>`).join('');
    const tablon = estado.grafico ? `<section class="panel"><h2>Tablón de la aldea</h2>${svgGrafico(M.MISIONES[7].generarDatos(estado.semilla), estado.grafico) || ''}</section>` : '';
    return `<section class="panel final"><h1>¡La aldea ha nacido!</h1>
      <p>${esc(r.nombre)}, has pasado de Aprendiz a ${esc(r.rango)} usando solo fórmulas de Excel.</p>
      <ul class="lista-simple"><li>Nivel: <b>${r.nivel}</b> (${esc(r.rango)})</li><li>XP total: <b>${r.xp}</b></li><li>Oro: <b>${r.oro}</b></li>${stats}
      <li>Códice completado: <b>${r.codiceDesbloqueadas}/${r.codiceTotal}</b></li></ul>
      <p class="proximamente">Próximamente: más misiones (Bosque de las Fórmulas).</p></section>${tablon}`;
  }

  function htmlCentro() {
    if (ui.ver >= NMISIONES) return `<main class="centro">${htmlFinal()}</main>`;
    const cx = contexto();
    const m = cx.m;
    const usadas = estado.pistas[m.id] || 0;
    const pistas = !cx.soloLectura && usadas ? `<ol class="pistas">${m.pistas.slice(0, usadas).map((p) => `<li>${esc(p)}</li>`).join('')}</ol>` : '';
    const msgs = ui.mensajes.length ? `<ul class="mensajes error" role="alert">${ui.mensajes.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : '';
    const botones = cx.soloLectura
      ? '<p class="suave">Misión completada: la estás revisando en modo solo lectura.</p>'
      : `<div class="botones">
          <button class="principal" data-act="entregar">Entregar al mayordomo</button>
          <button data-act="pista"${usadas >= 3 ? ' disabled' : ''}>Pista (${usadas}/3)</button>
          ${m.grafico ? '' : '<button data-act="rellenar">Rellenar hacia abajo</button>'}
        </div>`;
    return `<main class="centro">
      <section class="panel mision"><h2>Misión ${cx.idx + 1}: ${esc(m.titulo)}</h2>
        <p class="meta">${esc(m.dificultad)} · ${m.xp} XP · ${m.oro} oro</p>
        ${m.texto.map((t) => `<p>${esc(t)}</p>`).join('')}
        <div class="que-hacer"><h3>Qué tienes que hacer</h3><ul>${m.queHacer.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>
      </section>
      ${htmlAviso()}
      <section class="panel">
        ${m.grafico ? htmlHoja(cx) + htmlGraficoPanel(cx) : htmlBarra(cx) + htmlHoja(cx)}
        <div class="estado-msg" role="status">${esc(ui.estadoMsg)}</div>
        ${botones}${msgs}${pistas}
      </section></main>`;
  }

  function htmlBienvenida() {
    return `<div class="pantalla"><section class="panel"><h1>Excel RPG: El nacimiento de la aldea</h1>
      ${M.INTRO.bienvenida.map((t) => `<p>${esc(t)}</p>`).join('')}
      <label>¿Cómo te llamas? <input type="text" id="nombre" value="Daniel" maxlength="30" autocomplete="off"></label>
      <div class="botones"><button class="principal" data-act="empezar">Empezar</button>
      <button data-act="importar">Importar partida</button></div>
      <input type="file" id="archivo" accept=".json,application/json" hidden>
      ${ui.errorImportar ? `<p class="error" role="alert">${esc(ui.errorImportar)}</p>` : ''}</section></div>`;
  }

  function htmlTutorial() {
    return `<div class="pantalla"><section class="panel"><h1>Antes de empezar</h1>
      ${M.INTRO.tutorial.map((t) => `<h3>${esc(t.titulo)}</h3><p>${esc(t.texto)}</p>`).join('')}
      <div class="botones"><button class="principal" data-act="tutorial-ok">Entendido, ¡a la aldea!</button></div></section></div>`;
  }

  /* ---------- Render ---------- */
  function render() {
    const p = pantalla();
    if (p === 'bienvenida') raiz.innerHTML = htmlBienvenida();
    else if (p === 'tutorial') raiz.innerHTML = htmlTutorial();
    else raiz.innerHTML = htmlCabecera() + `<div class="rejilla">${htmlIzquierda()}${htmlCentro()}${htmlCodice()}</div>`;
    if (ui.editando) {
      const i = raiz.querySelector('.celda-input');
      if (i) { i.focus(); const n = i.value.length; i.setSelectionRange(n, n); }
    } else if (ui.enfocarHoja) {
      const w = raiz.querySelector('.hoja-wrap');
      if (w && w.focus) w.focus({ preventScroll: true });
    }
    ui.enfocarHoja = false;
  }

  /* ---------- Acciones ---------- */
  function iniciarEdicion(ref, inicial) {
    if (ui.ver >= NMISIONES) return;
    const cx = contexto();
    ui.estadoMsg = '';
    if (cx.soloLectura) { ui.estadoMsg = 'Esta misión ya está completada: solo puedes mirarla.'; render(); return; }
    if (!cx.edit.has(ref)) { ui.estadoMsg = `La celda ${ref} es de solo lectura. Solo puedes editar las celdas de «Qué tienes que hacer».`; render(); return; }
    ui.editando = { ref, texto: inicial === undefined || inicial === null ? (cx.hoja.crudo(ref) || '') : inicial };
    render();
  }

  function confirmarEdicion(dc, dr) {
    if (!ui.editando) return;
    const { ref, texto } = ui.editando;
    J.editarCelda(estado, ref, texto.trim() === '' ? '' : texto.trim());
    delete ui.resultado[ref];
    ui.editando = null;
    guardar();
    if (dc || dr) mover(dc, dr, false);
    ui.enfocarHoja = true;
    render();
  }

  function mover(dc, dr, extender) {
    const cx = contexto();
    const c = Math.max(0, Math.min(cx.datos.cols - 1, ui.sel.c + dc));
    const r = Math.max(1, Math.min(cx.datos.filas, ui.sel.r + dr));
    ui.sel = { c, r };
    if (!extender) ui.anchor = { c, r };
  }

  function rellenar() {
    if (ui.editando) confirmarEdicion(0, 0);
    const cx = contexto();
    ui.estadoMsg = '';
    if (cx.soloLectura) ui.estadoMsg = 'Esta misión ya está completada: solo puedes mirarla.';
    else {
      const rg = rangoSel();
      if (rg.r2 === rg.r1) ui.estadoMsg = 'Selecciona varias celdas de arriba abajo (clic en la primera y Mayús+clic en la última) y vuelve a pulsar Rellenar hacia abajo.';
      else {
        const superior = cx.hoja.crudoCR(rg.c, rg.r1);
        if (!superior) ui.estadoMsg = 'La celda superior de la selección está vacía: escribe primero la fórmula allí.';
        else {
          const nuevos = E.rellenarAbajo(superior, rg.r2 - rg.r1);
          let hechas = 0;
          nuevos.forEach((raw, i) => {
            const ref = E.refA1(rg.c, rg.r1 + 1 + i);
            if (cx.edit.has(ref) && J.editarCelda(estado, ref, raw)) { delete ui.resultado[ref]; hechas++; }
          });
          ui.estadoMsg = hechas ? `Fórmula copiada en ${hechas} celda${hechas === 1 ? '' : 's'}.` : 'Ninguna de las celdas seleccionadas se puede editar.';
          guardar();
        }
      }
    }
    ui.enfocarHoja = true;
    render();
  }

  function entregar() {
    if (ui.editando) confirmarEdicion(0, 0);
    const cx = contexto();
    if (cx.soloLectura) return;
    const entrega = estado.borradores[cx.m.id] || {};
    const r = J.entregar(estado, entrega, cx.m.grafico ? Object.assign({}, ui.grafico) : undefined);
    guardar();
    ui.estadoMsg = '';
    if (r.ok) { ui.aviso = r; ui.mensajes = []; ui.resultado = r.porCelda; }
    else { ui.aviso = null; ui.mensajes = r.mensajes; ui.resultado = cx.m.grafico ? {} : r.porCelda; }
    if (cx.m.grafico) ui.vistaGrafico = true;
    render();
  }

  function reiniciarUI() {
    ui.ver = Math.min(estado.misionActual, NMISIONES);
    ui.sel = { c: 0, r: 1 }; ui.anchor = { c: 0, r: 1 };
    ui.editando = null; ui.mensajes = []; ui.resultado = {}; ui.aviso = null; ui.estadoMsg = '';
    ui.grafico = { rango: '', tipo: '', titulo: '' }; ui.vistaGrafico = false;
  }

  function exportar() {
    try {
      const blob = new Blob([J.serializar(estado)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'aldea-partida.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      ui.errorImportar = 'No se pudo exportar la partida en este navegador.';
      render();
    }
  }

  function importarArchivo(file) {
    if (!file) return;
    const lector = new FileReader();
    lector.onload = () => {
      try {
        estado = J.cargar(String(lector.result));
        ui.errorImportar = '';
        guardar();
        reiniciarUI();
      } catch (e) { ui.errorImportar = 'No se pudo importar: el archivo no es una partida válida.'; }
      render();
    };
    lector.onerror = () => { ui.errorImportar = 'No se pudo leer el archivo.'; render(); };
    lector.readAsText(file);
  }

  /* ---------- Eventos ---------- */
  raiz.addEventListener('click', (e) => {
    const t = e.target;
    const td = t.closest && t.closest('td[data-ref]');
    if (td && !(t.classList && t.classList.contains('celda-input'))) {
      if (ui.editando) confirmarEdicion(0, 0);
      const pr = E.parsearRef(td.getAttribute('data-ref'));
      const nueva = { c: pr.c, r: pr.r };
      if (e.shiftKey && ui.anchor.c === nueva.c) ui.sel = nueva;
      else { ui.sel = nueva; ui.anchor = nueva; }
      ui.estadoMsg = '';
      ui.enfocarHoja = true;
      render();
      return;
    }
    const b = t.closest && t.closest('[data-act]');
    if (!b) return;
    const act = b.getAttribute('data-act');
    if (act === 'entregar') entregar();
    else if (act === 'pista') { J.usarPista(estado); guardar(); render(); }
    else if (act === 'rellenar') rellenar();
    else if (act === 'dibujar') {
      ui.vistaGrafico = true;
      render();
    } else if (act === 'siguiente') {
      ui.aviso = null; ui.resultado = {}; ui.mensajes = [];
      ui.ver = Math.min(estado.misionActual, NMISIONES);
      ui.sel = { c: 0, r: 1 }; ui.anchor = { c: 0, r: 1 };
      render();
    } else if (act === 'ver') {
      if (ui.editando) confirmarEdicion(0, 0);
      ui.ver = parseInt(b.getAttribute('data-i'), 10);
      ui.sel = { c: 0, r: 1 }; ui.anchor = { c: 0, r: 1 };
      ui.mensajes = []; ui.resultado = {}; ui.aviso = null; ui.estadoMsg = '';
      render();
    } else if (act === 'exportar') exportar();
    else if (act === 'importar') { const f = raiz.querySelector('#archivo'); if (f) f.click(); }
    else if (act === 'nueva') {
      if (window.confirm('¿Seguro que quieres empezar una partida nueva? Se perderá el progreso actual (exporta la partida antes si quieres conservarla).')) {
        J.borrarLocal();
        estado = J.nuevaPartida('', semillaNueva());
        reiniciarUI();
        guardar();
        render();
      }
    } else if (act === 'empezar') {
      const inp = raiz.querySelector('#nombre');
      const nombre = (inp && inp.value.trim()) || 'Daniel';
      estado.nombre = nombre;
      estado.iniciada = true;
      J.saltarEscuela(estado);
      guardar();
      render();
    } else if (act === 'tutorial-ok') {
      estado.tutorialVisto = true;
      guardar();
      render();
    }
  });

  raiz.addEventListener('dblclick', (e) => {
    const td = e.target.closest && e.target.closest('td[data-ref]');
    if (td && !(e.target.classList && e.target.classList.contains('celda-input'))) iniciarEdicion(td.getAttribute('data-ref'));
  });

  raiz.addEventListener('input', (e) => {
    const t = e.target;
    if (t.classList && t.classList.contains('celda-input') && ui.editando) {
      ui.editando.texto = t.value;
      const barra = raiz.querySelector('#barra-texto');
      if (barra) barra.textContent = t.value;
    } else if (t.getAttribute && t.getAttribute('data-campo')) ui.grafico[t.getAttribute('data-campo')] = t.value;
  });

  raiz.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'archivo') importarArchivo(t.files && t.files[0]);
    else if (t.getAttribute && t.getAttribute('data-campo')) ui.grafico[t.getAttribute('data-campo')] = t.value;
  });

  document.addEventListener('keydown', (e) => {
    if (pantalla() !== 'juego') return;
    const t = e.target;
    if (t && t.classList && t.classList.contains('celda-input')) {
      if (e.key === 'Enter') { e.preventDefault(); confirmarEdicion(0, 1); }
      else if (e.key === 'Tab') { e.preventDefault(); confirmarEdicion(1, 0); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); confirmarEdicion(0, 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); confirmarEdicion(0, -1); }
      else if (e.key === 'Escape') { e.preventDefault(); ui.editando = null; ui.enfocarHoja = true; render(); }
      else if (e.key === 'd' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); rellenar(); }
      return;
    }
    if (t && t.matches && t.matches('input, select, textarea')) return;
    if (t && t.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if (ui.ver >= NMISIONES) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); rellenar(); return; }
    const flechas = { ArrowDown: [0, 1], ArrowUp: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (flechas[e.key]) {
      e.preventDefault();
      mover(flechas[e.key][0], flechas[e.key][1], e.shiftKey);
      ui.estadoMsg = '';
      ui.enfocarHoja = true;
      render();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      mover(e.shiftKey ? -1 : 1, 0, false);
      ui.enfocarHoja = true;
      render();
    } else if (e.key === 'F2' || e.key === 'Enter') {
      e.preventDefault();
      iniciarEdicion(E.refA1(ui.sel.c, ui.sel.r));
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      const ref = E.refA1(ui.sel.c, ui.sel.r);
      iniciarEdicion(ref, '');
      if (ui.editando) confirmarEdicion(0, 0);
    } else if (e.key.length === 1 && !mod && !e.altKey) {
      e.preventDefault();
      iniciarEdicion(E.refA1(ui.sel.c, ui.sel.r), e.key);
    }
  });

  render();
})();

</script>
</body>
</html>
